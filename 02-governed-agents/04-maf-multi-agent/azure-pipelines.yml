trigger: none
pr: none

parameters:
  - name: enableEasyAuth
    displayName: Enable optional Easy Auth (requires ENTRA_CLIENT_ID)
    type: boolean
    default: false
  - name: linuxPoolName
    displayName: Linux pool name (Microsoft-hosted uses ubuntu-latest)
    type: string
    default: Microsoft-hosted
  - name: windowsPoolName
    displayName: Windows pool name (Microsoft-hosted uses windows-latest)
    type: string
    default: Microsoft-hosted
  - name: pocDirectory
    displayName: PoC directory relative to checkout root
    type: string
    default: .
  - name: provisionAgent365
    displayName: Register the MAF orchestrator with Agent 365
    type: boolean
    default: false

variables:
  - group: foundry-agents-poc-environment
  - name: pythonVersion
    value: "3.12"

stages:
  - stage: Validate
    jobs:
      - job: Test
        pool:
          ${{ if eq(parameters.linuxPoolName, 'Microsoft-hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.linuxPoolName }}
            demands:
              - Agent.OS -equals Linux
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              set -euo pipefail
              python -m pip install -r requirements-dev.txt
              python -m pytest
              python -m ruff check app tests
              python -m ruff format --check app tests
              python -m compileall -q app
            workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents/04-maf-multi-agent
            displayName: Test MAF application

  - stage: Deploy
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployMafApp
        pool:
          ${{ if eq(parameters.windowsPoolName, 'Microsoft-hosted') }}:
            vmImage: windows-latest
          ${{ else }}:
            name: ${{ parameters.windowsPoolName }}
            demands:
              - Agent.OS -equals Windows_NT
        environment: $(ADO_MAF_ENVIRONMENT_NAME)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - pwsh: .\tests\test_deployment.ps1
                  displayName: Test optional Easy Auth deployment modes
                  workingDirectory: $(Build.SourcesDirectory)\${{ parameters.pocDirectory }}\02-governed-agents\04-maf-multi-agent
                - task: AzureCLI@2
                  displayName: Provision and deploy MAF App Service
                  inputs:
                    azureSubscription: $(ADO_APP_SERVICE_CONNECTION)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)\${{ parameters.pocDirectory }}\02-governed-agents\04-maf-multi-agent
                    inlineScript: |
                      $easyAuthOptions = @{}
                      if ([bool]::Parse("${{ parameters.enableEasyAuth }}")) {
                        $easyAuthOptions = @{
                          EnableEasyAuth = $true
                          EntraClientId = $env:EASY_AUTH_CLIENT_ID
                        }
                      }
                      .\deploy.ps1 @easyAuthOptions `
                        -SubscriptionId "$(AZURE_SUBSCRIPTION_ID)" `
                        -TenantId "$(AZURE_TENANT_ID)" `
                        -ResourceGroupName "$(AZURE_RESOURCE_GROUP)" `
                        -Location "$(AZURE_LOCATION)" `
                        -AppServicePlanName "$(APP_SERVICE_PLAN_NAME)" `
                        -WebAppName "$(WEB_APP_NAME)" `
                        -Sku "$(APP_SERVICE_SKU)" `
                        -FoundryAccountName "$(FOUNDRY_ACCOUNT_NAME)" `
                        -ProjectEndpoint "$(PROJECT_ENDPOINT)" `
                        -ModelDeploymentName "$(MODEL_DEPLOYMENT_NAME)" `
                        -PromptAgentName "$(PROMPT_AGENT_NAME)" `
                        -RagAgentName "$(RAG_AGENT_NAME)" `
                        -ApplicationInsightsName "$(GOVERNED_APPLICATION_INSIGHTS_NAME)"
                  env:
                    ${{ if eq(parameters.enableEasyAuth, true) }}:
                      EASY_AUTH_CLIENT_ID: $(ENTRA_CLIENT_ID)

  - stage: Agent365
    displayName: Register MAF with Agent 365
    dependsOn: Deploy
    condition: and(succeeded(), ${{ eq(parameters.provisionAgent365, true) }})
    jobs:
      - deployment: RegisterMafAgent365
        pool:
          ${{ if eq(parameters.windowsPoolName, 'Microsoft-hosted') }}:
            vmImage: windows-latest
          ${{ else }}:
            name: ${{ parameters.windowsPoolName }}
            demands:
              - Agent.OS -equals Windows_NT
        environment: $(ADO_AGENT365_ENVIRONMENT_NAME)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: UseDotNet@2
                  displayName: Use .NET 8 for Agent 365 CLI
                  inputs:
                    packageType: sdk
                    version: 8.x
                - powershell: |
                    $ErrorActionPreference = "Stop"
                    $toolPath = Join-Path $env:USERPROFILE ".dotnet\tools"
                    $env:PATH = "$toolPath;$env:PATH"
                    Write-Host "##vso[task.prependpath]$toolPath"
                    if (-not (Get-Command a365 -ErrorAction SilentlyContinue)) {
                      dotnet tool install --global Microsoft.Agents.A365.DevTools.Cli
                      if ($LASTEXITCODE -ne 0) {
                        throw "Agent 365 CLI installation failed."
                      }
                    }
                    a365 --help
                    if ($LASTEXITCODE -ne 0) {
                      throw "Agent 365 CLI readiness check failed."
                    }
                  displayName: Ensure Agent 365 CLI is available
                - task: AzureCLI@2
                  displayName: Register and configure MAF Agent 365 identity
                  inputs:
                    azureSubscription: $(ADO_AGENT365_SERVICE_CONNECTION)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)\${{ parameters.pocDirectory }}
                    inlineScript: |
                      .\provision-agent365.ps1 `
                        -Scope Maf `
                        -SubscriptionId "$(AZURE_SUBSCRIPTION_ID)" `
                        -TenantId "$(AZURE_TENANT_ID)" `
                        -ResourceGroupName "$(AZURE_RESOURCE_GROUP)" `
                        -FoundryAccountName "$(FOUNDRY_ACCOUNT_NAME)" `
                        -WebAppName "$(WEB_APP_NAME)" `
                        -MafAgentName "$(AGENT365_MAF_AGENT_NAME)" `
                        -AuthMode "$(AGENT365_AUTH_MODE)"
