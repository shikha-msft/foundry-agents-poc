trigger: none
pr: none

parameters:
  - name: linuxPoolName
    displayName: Linux pool name (Microsoft-hosted uses ubuntu-latest)
    type: string
    default: Microsoft-hosted
  - name: windowsPoolName
    displayName: Windows pool name (Microsoft-hosted uses windows-latest)
    type: string
    default: Microsoft-hosted
  - name: pocDirectory
    displayName: PoC directory relative to checkout root
    type: string
    default: .
  - name: provisionInfrastructure
    displayName: Create or update Foundry projects and monitoring
    type: boolean
    default: false
  - name: createPromptAgent
    displayName: Create a new Prompt Agent version
    type: boolean
    default: true
  - name: createRagAgent
    displayName: Create a new RAG Agent version
    type: boolean
    default: false
  - name: ragIndexMode
    displayName: RAG index - reuse existing or create synthetic PoC data
    type: string
    default: existing
    values:
      - existing
      - create
  - name: ragIndexName
    displayName: RAG index name (defaults to the environment variable group)
    type: string
    default: $(AZURE_AI_SEARCH_INDEX_NAME)
  - name: enableAgent365Foundry
    displayName: Enable Agent 365 data collection on the Foundry resource
    type: boolean
    default: false
variables:
  - group: foundry-agents-poc-environment
  - name: pythonVersion
    value: "3.12"

stages:
  - stage: Validate
    displayName: Validate agent code
    jobs:
      - job: ValidateAgents
        displayName: Validate Prompt and RAG agents
        pool:
          ${{ if eq(parameters.linuxPoolName, 'Microsoft-hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.linuxPoolName }}
            demands:
              - Agent.OS -equals Linux
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: $(pythonVersion)

          - bash: |
              set -euo pipefail
              python -m pip install \
                -r 01-prompt-agent/requirements.txt \
                -r 02-rag-agent/requirements-dev.txt \
                "ruff>=0.11,<1"
              python -m ruff check \
                --config 'lint.isort.known-first-party = ["agent_governance", "prompt_agent", "rag_agent", "search_index"]' \
                agent_governance.py 01-prompt-agent/prompt_agent.py 02-rag-agent
              python -m ruff format --check agent_governance.py 01-prompt-agent/prompt_agent.py 02-rag-agent
              python -m compileall -q agent_governance.py 01-prompt-agent/prompt_agent.py 02-rag-agent
              python -m pytest 02-rag-agent/tests
            workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents
            displayName: Install and validate Python

          - bash: |
              set -euo pipefail
              python - <<'PY'
              import rag_agent

              settings = rag_agent.Settings.from_environment()
              definition = rag_agent._definition(settings).as_dict()
              index = definition["tools"][0]["azure_ai_search"]["indexes"][0]
              assert index["project_connection_id"] == settings.search_connection_id
              assert index["index_name"] == settings.search_index_name
              print("RAG definition validation passed.")
              PY
            workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents/02-rag-agent
            displayName: Validate RAG definition
            env:
              PROJECT_ENDPOINT: $(PROJECT_ENDPOINT)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              MODEL_DEPLOYMENT_NAME: $(MODEL_DEPLOYMENT_NAME)
              AGENT_NAME: $(RAG_AGENT_NAME)
              APPLICATION_INSIGHTS_RESOURCE_NAME: $(GOVERNED_APPLICATION_INSIGHTS_NAME)
              AZURE_AI_SEARCH_CONNECTION_ID: $(AZURE_AI_SEARCH_CONNECTION_ID)
              AZURE_AI_SEARCH_INDEX_NAME: pipeline-validation-index
              AZURE_AI_SEARCH_QUERY_TYPE: $(AZURE_AI_SEARCH_QUERY_TYPE)
              AZURE_AI_SEARCH_TOP_K: $(AZURE_AI_SEARCH_TOP_K)

      - job: ValidateAudio
        displayName: Validate Foundry TTS and transcription API
        pool:
          ${{ if eq(parameters.linuxPoolName, 'Microsoft-hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.linuxPoolName }}
            demands:
              - Agent.OS -equals Linux
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              set -euo pipefail
              python -m pip install -r requirements-dev.txt
              python -m pytest
              python -m ruff check audio_agent tests
              python -m ruff format --check audio_agent tests
              python -m compileall -q audio_agent
            workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents/03-multimodal-tts-agent
            displayName: Test audio API without cloud access

  - stage: Provision
    displayName: Provision Foundry projects
    dependsOn: Validate
    condition: and(succeeded(), ${{ eq(parameters.provisionInfrastructure, true) }})
    jobs:
      - deployment: ProvisionFoundry
        displayName: Run idempotent Foundry provisioning
        pool:
          ${{ if eq(parameters.windowsPoolName, 'Microsoft-hosted') }}:
            vmImage: windows-latest
          ${{ else }}:
            name: ${{ parameters.windowsPoolName }}
            demands:
              - Agent.OS -equals Windows_NT
        environment: $(ADO_INFRASTRUCTURE_ENVIRONMENT_NAME)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Create projects and monitoring resources
                  inputs:
                    azureSubscription: $(ADO_INFRASTRUCTURE_SERVICE_CONNECTION)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)\${{ parameters.pocDirectory }}
                    inlineScript: |
                      .\deploy.ps1 `
                        -SubscriptionId "$(AZURE_SUBSCRIPTION_ID)" `
                        -TenantId "$(AZURE_TENANT_ID)" `
                        -ResourceGroupName "$(AZURE_RESOURCE_GROUP)" `
                        -FoundryAccountName "$(FOUNDRY_ACCOUNT_NAME)" `
                        -Location "$(AZURE_LOCATION)" `
                        -ExperimentationProjectName "$(EXPERIMENTATION_PROJECT_NAME)" `
                        -ExperimentationProjectDisplayName "$(EXPERIMENTATION_PROJECT_DISPLAY_NAME)" `
                        -ExperimentationLogAnalyticsName "$(EXPERIMENTATION_LOG_ANALYTICS_NAME)" `
                        -ExperimentationApplicationInsightsName "$(EXPERIMENTATION_APPLICATION_INSIGHTS_NAME)" `
                        -GovernedProjectName "$(GOVERNED_PROJECT_NAME)" `
                        -GovernedProjectDisplayName "$(GOVERNED_PROJECT_DISPLAY_NAME)" `
                        -GovernedLogAnalyticsName "$(GOVERNED_LOG_ANALYTICS_NAME)" `
                        -GovernedApplicationInsightsName "$(GOVERNED_APPLICATION_INSIGHTS_NAME)"

  - stage: DeployAgents
    displayName: Create Foundry agent versions
    dependsOn:
      - Validate
      - Provision
    condition: |
      and(
        in(dependencies.Validate.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.Provision.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        or(
          ${{ eq(parameters.createPromptAgent, true) }},
          ${{ eq(parameters.createRagAgent, true) }}
        )
      )
    jobs:
      - deployment: CreateAgents
        displayName: Create selected agents
        pool:
          ${{ if eq(parameters.linuxPoolName, 'Microsoft-hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.linuxPoolName }}
            demands:
              - Agent.OS -equals Linux
        environment: $(ADO_AGENT_ENVIRONMENT_NAME)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: UsePythonVersion@0
                  displayName: Use Python $(pythonVersion)
                  inputs:
                    versionSpec: $(pythonVersion)

                - bash: |
                    set -euo pipefail
                    python -m pip install \
                      -r 01-prompt-agent/requirements.txt \
                      -r 02-rag-agent/requirements.txt
                  workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents
                  displayName: Install agent dependencies

                - ${{ if eq(parameters.createPromptAgent, true) }}:
                    - task: AzureCLI@2
                      displayName: Create Prompt Agent version
                      inputs:
                        azureSubscription: $(ADO_AGENT_SERVICE_CONNECTION)
                        scriptType: bash
                        scriptLocation: inlineScript
                        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents/01-prompt-agent
                        inlineScript: |
                          set -euo pipefail
                          python prompt_agent.py create | tee "$(Build.ArtifactStagingDirectory)/prompt-agent.json"
                      env:
                        PROJECT_ENDPOINT: $(PROJECT_ENDPOINT)
                        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                        AZURE_CLI_PROCESS_TIMEOUT: "60"
                        MODEL_DEPLOYMENT_NAME: $(MODEL_DEPLOYMENT_NAME)
                        AGENT_NAME: $(PROMPT_AGENT_NAME)
                        APPLICATION_INSIGHTS_RESOURCE_NAME: $(GOVERNED_APPLICATION_INSIGHTS_NAME)

                - ${{ if eq(parameters.createRagAgent, true) }}:
                    - task: AzureCLI@2
                      displayName: Create RAG Agent version
                      inputs:
                        azureSubscription: $(ADO_AGENT_SERVICE_CONNECTION)
                        scriptType: bash
                        scriptLocation: inlineScript
                        workingDirectory: $(Build.SourcesDirectory)/${{ parameters.pocDirectory }}/02-governed-agents/02-rag-agent
                        inlineScript: |
                          set -euo pipefail
                          if [ -z "${AZURE_AI_SEARCH_INDEX_NAME:-}" ]; then
                            echo "##vso[task.logissue type=error]AZURE_AI_SEARCH_INDEX_NAME must be defined as a pipeline variable."
                            exit 1
                          fi
                          python rag_agent.py create --index-mode "$RAG_INDEX_MODE" | tee "$(Build.ArtifactStagingDirectory)/rag-agent.json"
                      env:
                        PROJECT_ENDPOINT: $(PROJECT_ENDPOINT)
                        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                        AZURE_CLI_PROCESS_TIMEOUT: "60"
                        MODEL_DEPLOYMENT_NAME: $(MODEL_DEPLOYMENT_NAME)
                        AGENT_NAME: $(RAG_AGENT_NAME)
                        APPLICATION_INSIGHTS_RESOURCE_NAME: $(GOVERNED_APPLICATION_INSIGHTS_NAME)
                        AZURE_AI_SEARCH_CONNECTION_ID: $(AZURE_AI_SEARCH_CONNECTION_ID)
                        AZURE_AI_SEARCH_INDEX_NAME: ${{ parameters.ragIndexName }}
                        RAG_INDEX_MODE: ${{ parameters.ragIndexMode }}
                        AZURE_AI_SEARCH_QUERY_TYPE: $(AZURE_AI_SEARCH_QUERY_TYPE)
                        AZURE_AI_SEARCH_TOP_K: $(AZURE_AI_SEARCH_TOP_K)
                        AZURE_AI_EMBEDDING_ENDPOINT: $(AZURE_AI_EMBEDDING_ENDPOINT)
                        AZURE_AI_EMBEDDING_DEPLOYMENT_NAME: $(AZURE_AI_EMBEDDING_DEPLOYMENT_NAME)

                - task: PublishPipelineArtifact@1
                  displayName: Publish agent creation responses
                  inputs:
                    targetPath: $(Build.ArtifactStagingDirectory)
                    artifact: foundry-agent-responses
                    publishLocation: pipeline

  - stage: Agent365
    displayName: Enable Foundry Agent 365 integration
    dependsOn:
      - Provision
      - DeployAgents
    condition: |
      and(
        not(canceled()),
        in(dependencies.Provision.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        in(dependencies.DeployAgents.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        ${{ eq(parameters.enableAgent365Foundry, true) }}
      )
    jobs:
      - deployment: EnableFoundryAgent365
        displayName: Enable Foundry Agent 365 data collection
        pool:
          ${{ if eq(parameters.windowsPoolName, 'Microsoft-hosted') }}:
            vmImage: windows-latest
          ${{ else }}:
            name: ${{ parameters.windowsPoolName }}
            demands:
              - Agent.OS -equals Windows_NT
        environment: $(ADO_AGENT365_ENVIRONMENT_NAME)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Enable and validate Agent 365
                  inputs:
                    azureSubscription: $(ADO_AGENT365_SERVICE_CONNECTION)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)\${{ parameters.pocDirectory }}
                    inlineScript: |
                      .\provision-agent365.ps1 `
                        -Scope Foundry `
                        -SubscriptionId "$(AZURE_SUBSCRIPTION_ID)" `
                        -TenantId "$(AZURE_TENANT_ID)" `
                        -ResourceGroupName "$(AZURE_RESOURCE_GROUP)" `
                        -FoundryAccountName "$(FOUNDRY_ACCOUNT_NAME)"
